<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do ponto</title>
</head>
<body style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f6f4">
<div id="msg" style="padding:24px;color:#555">Carregando o painel...</div>
<script>
const origem = 'https://wastebank.app.n8n.cloud/webhook/painel-ponto' + location.search;
fetch(origem)
  .then(r => r.text())
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(e => { document.getElementById('msg').textContent = 'Não foi possível carregar o painel: ' + e.message; });
</script>
</body>
</html>
